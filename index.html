<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chile Morrón</title>
    <style>
        @font-face {
            font-family: 'Pinyon Script';
            src: url('Pinyon_Script/PinyonScript-Regular.ttf') format('truetype');
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f686b6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 100%;
            max-height: 80vh;
            height: auto;
            object-fit: contain;
        }

        .title-text {
            font-family: 'Pinyon Script', cursive;
            font-size: 4rem;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <img src="chilemorron.png" alt="Chile Morrón">
    <div class="title-text">Puto el que lo escanee</div>
</body>
</html>
